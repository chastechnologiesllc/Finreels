name: Build iOS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Analyse, test, and compile Flutter iOS
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Disable Swift Package Manager for CocoaPods-only plugins
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure iOS host project
        run: |
          if [ ! -d ios/Runner.xcodeproj ]; then
            flutter create . \
              --platforms=ios \
              --project-name finreels \
              --org com.chastechgroup \
              --ios-language swift
          fi
          # flutter create may regenerate the default MyApp test.
          rm -f test/widget_test.dart
          # The generated Runner target defaults below the Workmanager minimum.
          if [ -f ios/Runner.xcodeproj/project.pbxproj ]; then
            sed -i '' -E 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/g' ios/Runner.xcodeproj/project.pbxproj
          fi

      - name: Analyse
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Prepare iOS build configuration
        run: flutter build ios --release --no-codesign --config-only --build-number=${{ github.run_number }}

      - name: Compile iOS without signing
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build
