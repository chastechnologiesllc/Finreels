name: Build iOS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Analyse, test, and compile Flutter iOS
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure iOS host project
        run: |
          if [ ! -d ios/Runner.xcodeproj ]; then
            flutter create . \
              --platforms=ios \
              --project-name finreels \
              --org com.chastechgroup \
              --ios-language swift
          fi
          # flutter create may regenerate the default MyApp test.
          rm -f test/widget_test.dart

      - name: Analyse
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Compile iOS without signing
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
