<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="FinReels - Financial Literacy Video Hub by chAs Technologies LLC">
  <meta name="robots" content="index,follow">
  <meta name="application-name" content="FinReels">
  <link rel="canonical" href="https://chastechnologiesllc.github.io/Finreels/">

  <!-- Declare support for both light and dark colour schemes.
       This alone makes most modern browsers use the correct system scrollbar,
       form control, and default background colours before any CSS runs. -->
  <meta name="color-scheme" content="light dark">

  <!-- Open Graph / WhatsApp / social share — absolute icon so previews show logo -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="FinReels">
  <meta property="og:title" content="FinReels">
  <meta property="og:description" content="FinReels - Financial Literacy Video Hub by chAs Technologies LLC">
  <meta property="og:image" content="https://chastechnologiesllc.github.io/Finreels/icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:url" content="https://chastechnologiesllc.github.io/Finreels/">

  <!-- Twitter card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="FinReels">
  <meta name="twitter:description" content="FinReels - Financial Literacy Video Hub by chAs Technologies LLC">
  <meta name="twitter:image" content="https://chastechnologiesllc.github.io/Finreels/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinReels">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png"/>

  <title>FinReels</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#000000">

  <style>
    /*
     * Pre-Flutter-load body background.
     * Matches AppTheme.lightBg / AppTheme.darkBg so the page-load blank
     * frame is the same colour the Flutter splash will render, eliminating
     * the white-flash-before-dark-app (or vice-versa) that users see on
     * slow connections before flutter_bootstrap.js takes over.
     */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #ffffff; /* light default — AppTheme.lightBg */
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #000000; /* dark — AppTheme.darkBg */
      }
    }

    /*
     * YouTube iframe platform-view containers.
     * Flutter web wraps each HtmlElementView in a <flt-platform-view> div.
     * Without this rule the outer div is transparent; on a white body this
     * means a white flash is visible while the iframe's own black background
     * hasn't painted yet.
     */
    flt-platform-view iframe {
      background-color: #000000 !important;
    }

    /* Paint a tiny, dependency-free boot state before Flutter's JS bundle
       downloads. It is removed on the flutter-first-frame event below. */
    #finreels-web-boot {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #ffffff;
      color: #111111;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: opacity 180ms ease-out;
    }
    #finreels-web-boot.is-hidden {
      opacity: 0;
      pointer-events: none;
    }
    #finreels-web-boot .boot-content {
      display: grid;
      justify-items: center;
      gap: 14px;
    }
    #finreels-web-boot .boot-mark {
      display: grid;
      place-items: center;
      width: 62px;
      height: 62px;
      border-radius: 18px;
      background: #d49a1e;
      color: #ffffff;
      font-size: 36px;
      font-weight: 800;
      line-height: 1;
    }
    #finreels-web-boot .boot-name {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.6px;
    }
    #finreels-web-boot .boot-status {
      color: #6f6f6f;
      font-size: 13px;
    }
    @media (prefers-color-scheme: dark) {
      #finreels-web-boot {
        background: #000000;
        color: #ffffff;
      }
      #finreels-web-boot .boot-status {
        color: #aaaaaa;
      }
    }
  </style>

  <!-- AdSense loader (test client). Replace client= with production ca-pub. -->
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3940256099942544"
    crossorigin="anonymous"></script>
</head>
<body>
  <div id="finreels-web-boot" role="status" aria-live="polite" aria-label="Loading FinReels">
    <div class="boot-content">
      <div class="boot-mark" aria-hidden="true">▶</div>
      <div class="boot-name">FinReels</div>
      <div class="boot-status">Opening your learning space…</div>
    </div>
  </div>
  <script>
    (function () {
      var boot = document.getElementById('finreels-web-boot');
      if (!boot) return;
      function hideBoot() {
        boot.classList.add('is-hidden');
        window.setTimeout(function () {
          if (boot.parentNode) boot.parentNode.removeChild(boot);
        }, 220);
      }
      window.addEventListener('flutter-first-frame', hideBoot, { once: true });
      // Never leave the static boot layer over a failed or unusually slow
      // Flutter bootstrap; the app's own recovery UI must remain reachable.
      window.setTimeout(hideBoot, 12000);
    }());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
