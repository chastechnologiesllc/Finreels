<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #FFFFFF;
            position: relative;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        .content-wrapper {
            position: absolute;
            bottom: 80px;
            left: 80px;
            width: 900px;
            border-left: 12px solid #DAA520;
            padding-left: 40px;
        }
        .title {
            color: #0F0F0F;
            font-weight: 900;
            font-size: 84px;
            line-height: 1.05;
            letter-spacing: -0.04em;
            margin-bottom: 24px;
        }
        .subtitle {
            color: #9E9E9E;
            font-weight: 300;
            font-size: 32px;
            line-height: 1.4;
            max-width: 700px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="content-wrapper">
            <h1 class="title">Free Books.<br>Complete Learning Paths.</h1>
            <p class="subtitle">A systematic blueprint for Finreels’ legally accessible, non-fiction knowledge base</p>
        </div>
    </div>
</body>
</html>
