plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.chastechgroup.finreels"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Required by flutter_local_notifications for Java 8+ APIs on older Android
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "com.chastechgroup.finreels"
        minSdk 23
        targetSdk 36
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true

        // ── Size: restrict native libs to real phone/tablet architectures ──
        // google_mobile_ads, unity-ads, and flutter_inappwebview each ship
        // native .so files for 4 ABIs (arm64-v8a, armeabi-v7a, x86, x86_64).
        // x86/x86_64 only matter for emulators — essentially zero real
        // phones/tablets run them. Combined with --split-per-abi in CI,
        // this keeps each release APK to only the slice a real device
        // needs. (If Chromebook/x86 support is ever needed, add "x86_64"
        // back here — Play App Signing will then also serve that slice.)
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }

        // ── Size: only bundle English resource strings ──────────────────────
        // AndroidX/Play Services libraries ship 60+ locale variants of
        // their internal strings by default. This app's UI is English-only
        // (no intl/ARB setup), so every other locale is dead weight.
        resConfigs "en"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    source "../.."
}

// ── Dependency conflict resolution ────────────────────────────────────────────
// work-runtime ≥2.8.0 merged the Kotlin extension classes (OneTimeWorkRequestKt,
// PeriodicWorkRequestKt) that previously lived in work-runtime-ktx. When
// flutter_local_notifications pulls work-runtime:2.8.1 and workmanager pulls
// work-runtime-ktx:2.7.0, Gradle sees both sets of those class files and throws
// "Duplicate class". Forcing both to the same version removes the conflict.
configurations.all {
    resolutionStrategy {
        force 'androidx.work:work-runtime:2.8.1'
        force 'androidx.work:work-runtime-ktx:2.8.1'
        // ── Google Play Billing Library 8.0.0 ───────────────────────────────
        // Google Play requires billing library ≥8.0.0 from Aug 31, 2026.
        // in_app_purchase's transitive dependency resolves to an older version;
        // forcing here overrides it without waiting for the plugin to publish
        // its own update. Billing 8 maintains backward compatibility for the
        // core purchase APIs that in_app_purchase uses.
        force 'com.android.billingclient:billing:8.0.0'
        force 'com.android.billingclient:billing-ktx:8.0.0'
    }
}

dependencies {
    // Core library desugaring — required by flutter_local_notifications
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    implementation "androidx.multidex:multidex:2.0.1"

    // ── Unity Ads mediation (served through AdMob) ──────────────────────
    // google_mobile_ads (the Flutter plugin) already brings in
    // com.google.android.gms:play-services-ads transitively. Gradle's
    // standard dependency resolution always picks the HIGHEST declared
    // version for a given artifact across the whole project, so this
    // adapter's own play-services-ads:25.4.0 requirement is satisfied
    // automatically — no need to declare/pin that artifact here ourselves.
    implementation "com.unity3d.ads:unity-ads:4.18.1"
    implementation "com.google.ads.mediation:unity:4.18.1.0"
}
